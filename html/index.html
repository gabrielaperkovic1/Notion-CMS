<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes Blog</title>
    <link rel="stylesheet" href="../css/user.css">
</head>
<body>
    <header>
        <a href="/"></a><img src="/logo/logonew2.png" alt="Recipe Blog logo"></a>
        <a href="/"><h1 id="logoTitle">RECIPES BLOG</h1></a>
    </header>

    <div id="search">
    <input type="text" id="searchInput" placeholder="Search recipes...">
    <button onclick="searchRecipes(document.getElementById('searchInput').value)"><span>🔍︎</span></button>
</div>

    <div id="filter">
    <label for="category">Category:</label>
    <select name="category" id="category">
        <option value="All">All categories</option>
        <option value=" Main dish">Main dish</option>
        <option value=" Side dish">Side dish</option>
        <option value="Dessert">Dessert</option>
    </select>
    <button onclick="filterRecipes(document.getElementById('category').value)">FILTER</button>
    </div>

    <ul id="recipes"></ul>
    <script src="/js/load_recipes.js"></script>

    <footer>
        All shown images are taken from Unsplash.
    </footer>
</body>
</html>
