<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes Blog Editor</title>
    <link rel="stylesheet" href="../css/user.css">
</head>
 
<body>
 
    <header>
        <a href="/author"><img src="/logo/logonew2.png" alt="Recipe Blog logo"></a>
        <a href="/author"><h1 id="logoTitle">RECIPES EDITOR</h1></a>
    </header>
 
  <div>
    <div id="authForms">
      <div id="loginForm">
        <h2>Log in</h2>
 
        <div>
          <label for="email">Email: </label>
          <input type="email" id="email" placeholder="you@example.com">
        </div>
 
        <div>
          <label for="password">Password: </label>
          <input type="password" id="password" placeholder="Enter your password">
        </div>
 
        <button class="buttons" onclick="login()">Log in</button>
      </div>
    </div>
 
    <div>
      <div id="signupForm">
        <h2>Sign up</h2>
 
        <div>
          <div>
            <label for="firstName">First name: </label>
            <input type="text" id="firstName" placeholder="First name">
          </div>
 
          <div>
            <label for="lastName">Last name: </label>
            <input type="text" id="lastName" placeholder="Last name">
          </div>
 
        </div>
        <div>
          <label for="nickname">Nickname: </label>
          <input type="text" id="nickname" placeholder="Nickname">
        </div>
 
        <div>
          <label for="signupEmail">Email: </label>
          <input type="email" id="signupEmail" placeholder="you@example.com">
        </div>
 
        <div>
          <label for="signupPassword">Password: </label>
          <input type="password" id="signupPassword" placeholder="Choose a password">
        </div>
 
        <button class="buttons" onclick="signup()">Sign up</button>
 
        <br><br>
      </div>
    </div>
 
  </div>
  
  <div id="adminPanel" hidden>
  <button id="logoutButton" class="buttons" onclick="logout()">Log out</button>

 <div id="recipeHeader">
    <h2>MY RECIPES</h2>
    <button class="buttons" type="button" id="showRecipeForm">Add new recipe</button>
  </div>
    
  <div id="newRecipeSection" hidden>
      <button type="button" class="buttons" id="cancelAdd">X</button>
      <h3>ADD NEW RECIPE</h2>

      <form id="newRecipeForm">
        <label for="newRecipeName">Name of dish: </label>
        <input type="text" id="newRecipeName" placeholder="Name of dish" required  >
        <br>

        <label for="newRecipePhoto">Photo URL: </label>
        <input type="url" id="newRecipePhoto" placeholder="https://exampleOfUrl.com/photo.jpg" required>
        <br>

        <label for="newRecipeIngredients">Ingredients: </label>
        <textarea id="newRecipeIngredients" placeholder="Ingredients" rows="7" cols="35" required></textarea>
        <br>

        <label for="newRecipeInstructions">Instructions: </label>
        <textarea id="newRecipeInstructions" placeholder="Instructions" rows="7" cols="35" required></textarea>
        <br>

        <label for="newRecipePrepH">Prep time: </label>

        <input type="number" id="newRecipePrepH" min="0"  value="0" required>
        <span>h</span>

        <input type="number" id="newRecipePrepMin" min="0" max="59" value="0" required>
        <span>min</span>

        <br>

        <label for="newRecipeCategory">Category: </label>
        <select id="newRecipeCategory" required>
            <option value="">Choose category</option>
            <option value="Main Dish">Main Dish</option>
            <option value="Side Dish">Side Dish</option>
            <option value="Snack">Dessert</option>
        </select>
        <br>

        <label for="newRecipeDifficulty">Difficulty: </label>
        <select id="newRecipeDifficulty" required>
            <option value="">Choose difficulty</option>
            <option value="1">1 - Very easy</option>
            <option value="2">2 - Easy</option>
            <option value="3">3 - Medium</option>
            <option value="4">4 - Hard</option>
            <option value="5">5 - Very hard</option>
        </select>
        <br>

        <br>
        <label for="newRecipeStatus">Publish: </label>
        <input type="checkbox" id="newRecipeStatus">
        </br>

        <button class="buttons" type="submit">Add recipe</button>
      </form>

      <p id="createStatus"></p>
    </div>

        <div id="myRecipes">

      <div class="draftRecipes">
        <h3>DRAFTS</h3>
        <div id="draftRecipes">
        </div>
      </div>

      <div class="publishedRecipes">
        <h3>PUBLISHED RECIPES</h3>
        <div id="publishedRecipes">
        </div>
      </div>

    </div>
    </div>

  <script type="module" src="../js/authentication.js"></script>
  <script type="module" src="/js/recipe_editor.js"></script>

  <footer>
        All shown images are taken from Unsplash.
  </footer>
 
</body>
</html>
